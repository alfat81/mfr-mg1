name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один параллельный деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site for GitHub Pages
        env:
          # GITHUB_REPOSITORY автоматически прокидывается GitHub Actions
          # Формат: "owner/repo" — используется в next.config.github.ts для basePath
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Если деплоите на кастомный домен (CNAME → mfr-mg.ru), раскомментируйте:
          # BASE_PATH: ""
        run: bun run build:github

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Add CNAME (if custom domain)
        if: env.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "$CUSTOM_DOMAIN" > ./out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
